apply plugin: 'com.android.application'

android {
    namespace 'it.agoldoni.consumocarburanti'
    compileSdk 34

    defaultConfig {
        applicationId "it.agoldoni.consumocarburanti"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Identificazione origine app
        buildConfigField "String", "APP_AUTHOR", "\"Alberto Goldoni\""
        buildConfigField "String", "BUILD_DATE", "\"${new Date().format('yyyy-MM-dd HH:mm')}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file('release-key.jks')
            storePassword 'consumocarburanti2024'
            keyAlias 'consumo_carburanti'
            keyPassword 'consumocarburanti2024'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name_override", "Consumo Carburanti (Debug)"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "app_name_override", "Consumo Carburanti"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/io.netty.versions.properties'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'com.hivemq:hivemq-mqtt-client:1.3.3'
    implementation 'com.google.code.gson:gson:2.10.1'
}
